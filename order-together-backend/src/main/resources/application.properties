spring.application.name=order-together-backend
server.port=8080

# --- Swiggy Builders Club MCP ---
swiggy.mcp.base-url=https://mcp.swiggy.com
swiggy.mcp.food-path=/food
# Dev-only fallback token. Leave blank in prod; the Flutter client forwards the
# OAuth 2.1 (PKCE) access token in the Authorization header instead.
swiggy.mcp.token=${SWIGGY_MCP_TOKEN:}
swiggy.mcp.default-address-id=${SWIGGY_DEFAULT_ADDRESS_ID:d3su1n0nfvanns8h7l4g}
swiggy.mcp.timeout-seconds=20

# --- OAuth 2.1 (server-side PKCE broker) ---
# Set APP_PUBLIC_URL to the public HTTPS URL of this server.
# Local dev: export APP_PUBLIC_URL=https://xxxx.ngrok-free.app
# Production: export APP_PUBLIC_URL=https://<droplet-ip-or-domain>
app.public-url=${APP_PUBLIC_URL}
app.oauth.client-id=swiggy-mcp
app.oauth.auth-endpoint=https://mcp.swiggy.com/auth/authorize
app.oauth.token-endpoint=https://mcp.swiggy.com/auth/token
app.oauth.scope=mcp:tools
# Deep-link scheme used to return the token to the Flutter app.
app.oauth.deep-link-scheme=com.ordertogether://auth