name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Build JAR ─────────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build JAR
        working-directory: order-together-backend
        run: ./mvnw package -DskipTests -q

      # ── 3. Prepare SSH ───────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      # ── 4. Write config files locally (then SCP them) ────────────────────────
      - name: Write config files
        run: |
          mkdir -p _deploy

          # Environment variables for the app
          cat > _deploy/app.env << EOF
          APP_PUBLIC_URL=${{ secrets.APP_PUBLIC_URL }}
          SWIGGY_MCP_TOKEN=
          SWIGGY_DEFAULT_ADDRESS_ID=${{ secrets.SWIGGY_DEFAULT_ADDRESS_ID }}
          EOF

          # systemd service unit
          cat > _deploy/ordertogether.service << 'EOF'
          [Unit]
          Description=Order Together Backend
          After=network.target

          [Service]
          User=root
          WorkingDirectory=/opt/ordertogether
          EnvironmentFile=/opt/ordertogether/.env
          ExecStart=/usr/bin/java -jar /opt/ordertogether/app.jar
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF

          # HTTP-only nginx config — used on first deploy for ACME challenge
          cat > _deploy/nginx-http.conf << 'EOF'
          server {
              listen 80;
              server_name order-together.sahanshah.dev;
              location / {
                  proxy_pass http://localhost:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 60s;
              }
          }
          EOF

          # Full HTTPS nginx config — used on every deploy once cert exists
          cat > _deploy/nginx-https.conf << 'EOF'
          server {
              listen 80;
              server_name order-together.sahanshah.dev;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              server_name order-together.sahanshah.dev;

              ssl_certificate /etc/letsencrypt/live/order-together.sahanshah.dev/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/order-together.sahanshah.dev/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_prefer_server_ciphers off;

              location / {
                  proxy_pass http://localhost:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 60s;
              }
          }
          EOF

      # ── 5. Install prerequisites on Droplet (before SCP) ────────────────────
      - name: Install Java, nginx and certbot
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DROPLET_HOST }} bash << 'ENDSSH'
            set -e
            pkgs=()
            command -v java    &>/dev/null || pkgs+=(openjdk-21-jre-headless)
            command -v nginx   &>/dev/null || pkgs+=(nginx)
            command -v certbot &>/dev/null || pkgs+=(certbot python3-certbot-nginx)
            if [ ${#pkgs[@]} -gt 0 ]; then
              echo "Installing: ${pkgs[*]}"
              apt-get update -q
              apt-get install -y "${pkgs[@]}"
            fi
            mkdir -p /opt/ordertogether /etc/nginx/sites-available /etc/nginx/sites-enabled
          ENDSSH

      # ── 6. Upload files to Droplet ───────────────────────────────────────────
      - name: Upload files
        env:
          SCP: scp -i ~/.ssh/deploy_key
        run: |
          $SCP order-together-backend/target/order-together-backend-0.0.1-SNAPSHOT.jar \
               root@${{ secrets.DROPLET_HOST }}:/opt/ordertogether/app.jar

          $SCP _deploy/app.env \
               root@${{ secrets.DROPLET_HOST }}:/opt/ordertogether/.env

          $SCP _deploy/ordertogether.service \
               root@${{ secrets.DROPLET_HOST }}:/etc/systemd/system/ordertogether.service

          $SCP _deploy/nginx-http.conf \
               root@${{ secrets.DROPLET_HOST }}:/opt/ordertogether/nginx-http.conf

          $SCP _deploy/nginx-https.conf \
               root@${{ secrets.DROPLET_HOST }}:/opt/ordertogether/nginx-https.conf

      # ── 7. Enable service, configure nginx with HTTPS, restart ───────────────
      - name: Start and verify
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DROPLET_HOST }} bash << 'ENDSSH'
            set -e

            systemctl daemon-reload
            systemctl enable ordertogether

            CERT_DIR=/etc/letsencrypt/live/order-together.sahanshah.dev

            # First deploy: no cert yet — serve HTTP so certbot can complete the challenge
            if [ ! -d "$CERT_DIR" ]; then
              cp /opt/ordertogether/nginx-http.conf /etc/nginx/sites-available/ordertogether
              ln -sf /etc/nginx/sites-available/ordertogether \
                     /etc/nginx/sites-enabled/ordertogether
              rm -f /etc/nginx/sites-enabled/default
              nginx -t && systemctl reload nginx

              echo "Obtaining TLS certificate..."
              certbot certonly --nginx \
                -d order-together.sahanshah.dev \
                --non-interactive --agree-tos \
                -m k.sahanshah@gmail.com
            fi

            # Apply full HTTPS config (cert is guaranteed to exist at this point)
            cp /opt/ordertogether/nginx-https.conf /etc/nginx/sites-available/ordertogether
            ln -sf /etc/nginx/sites-available/ordertogether \
                   /etc/nginx/sites-enabled/ordertogether
            rm -f /etc/nginx/sites-enabled/default
            nginx -t && systemctl reload nginx

            systemctl restart ordertogether
            sleep 5

            if systemctl is-active --quiet ordertogether; then
              echo "✅ ordertogether is running"
            else
              echo "❌ Service failed to start — last 30 log lines:"
              journalctl -u ordertogether -n 30 --no-pager
              exit 1
            fi
          ENDSSH
